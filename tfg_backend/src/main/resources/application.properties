spring.application.name=tfg_backend

# === CARGAR .env PRIMERO ===
spring.config.additional-location=optional:file:./tfg_backend/.env[.properties],optional:file:./.env[.properties]

# === PERFIL ACTIVO (dev para local, prod para producción) ===
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === JSON ===
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.default-view-inclusion=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# === DATABASE (SPECIFICS PER PROFILE: application-dev.properties, application-prod.properties) ===
# Base datasource configuration (overridden by profile-specific files)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rutas_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.socket-timeout=30000

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# === MAIL (SMTP - envio de correos de recuperacion de cuenta) ===
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

# === SERVER ===
server.port=${PORT:8080}
server.tomcat.connection-timeout=15000
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.shutdown=graceful
server.servlet.session.timeout=30m

# === APP ===
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
