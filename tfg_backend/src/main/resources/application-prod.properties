# =============================================
# PERFIL: PRODUCCIÓN (Render.com + Environment Variables)
# =============================================
# En producción, TODAS las credenciales vienen de variables de entorno
# Render.com inyecta: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.

# Database (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}?serverTimezone=UTC&useSSL=true&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=utf8&connectTimeout=30000&socketTimeout=60000&autoReconnect=true&failOverReadOnly=false&maxReconnects=3
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=60000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size_in_queries=true
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Logging (reduce verbose output on startup)
logging.level.root=WARN
logging.level.com.example.tfg_backend=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN

# Production security
spring.jpa.open-in-view=false

# Tomcat connection timeout
server.tomcat.connection-timeout=15000
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.shutdown=graceful
server.port=${PORT:8080}

# === APP ===
app.frontend.url=${FRONTEND_URL:https://adventure-web-project.netlify.app/}
