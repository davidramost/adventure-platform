# =============================================
# PERFIL: PRODUCCIÓN (Render.com + Environment Variables)
# =============================================
# En producción, TODAS las credenciales vienen de variables de entorno
# Render.com inyecta: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.

# Database (from environment variables)
# SPRING_DATASOURCE_URL debe ser la URL base sin parametros extra, ej:
#   jdbc:mysql://hostname:3306/dbname
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Propiedades JDBC separadas (mysql-connector-j 9.x, sin autoReconnect obsoleto)
spring.datasource.hikari.data-source-properties.serverTimezone=UTC
spring.datasource.hikari.data-source-properties.useSSL=true
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=utf8
spring.datasource.hikari.data-source-properties.connectTimeout=30000
spring.datasource.hikari.data-source-properties.socketTimeout=60000

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=HikariPool-Prod
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.maximum-pool-size=3
# 0 = no crea conexiones en startup, solo cuando llega el primer request
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
# -1 = no falla en startup si la BD tarda en despertar
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.keepalive-time=60000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Lazy init: la app arranca en segundos, las conexiones se crean en el primer request
spring.main.lazy-initialization=true
# Los JPA repositories se inicializan en hilo de fondo tras el arranque
spring.data.jpa.repositories.bootstrap-mode=deferred

# Hibernate: evitar acceso a metadatos JDBC en el arranque (acelera startup)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Logging (reduce verbose output on startup)
logging.level.root=WARN
logging.level.com.example.tfg_backend=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN

# Tomcat
server.tomcat.connection-timeout=15000
server.tomcat.accept-count=100

# Actuator: solo exponer health para el health check de Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.shutdown=graceful
server.port=${PORT:8080}

# === APP ===
app.frontend.url=${FRONTEND_URL:https://adventure-web-project.netlify.app/}
