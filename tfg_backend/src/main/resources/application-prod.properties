# =============================================
# PERFIL: PRODUCCIÓN (Render.com + Environment Variables)
# =============================================
# En producción, TODAS las credenciales vienen de variables de entorno
# Render.com inyecta: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, etc.

# Database (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}?serverTimezone=UTC&useSSL=true&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP Connection Pool (CRITICAL FOR STABILITY)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.socket-timeout=30000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging (INFO para debugging de startup, cambiar a WARN cuando esté estable)
logging.level.root=INFO
logging.level.com.example.tfg_backend=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.hibernate.engine.transaction.internal=DEBUG

# Production security
spring.jpa.open-in-view=false

# Tomcat connection timeout
server.tomcat.connection-timeout=20000

# === APP ===
app.frontend.url=${FRONTEND_URL:https://adventure-web-project.netlify.app/}
